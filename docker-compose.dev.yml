name: kura-ai-dev

services:
  nginx:
    ports: 
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./kura-frontend
      dockerfile: Dockerfile.dev
    networks:
      - kura-network-dev
    volumes:
      - ./kura-frontend/src:/app/src
      - ./kura-frontend/angular.json:/app/angular.json
      - ./kura-frontend/tsconfig.json:/app/tsconfig.json
      - ./kura-frontend/tsconfig.app.json:/app/tsconfig.app.json
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  # Required for file watchin in Docker
      - WATCHPACK_POLLING=true    # Alternative polling option
      - NG_CLI_ANALYTICS=false
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./kura-backend
      dockerfile: Dockerfile.dev
    volumes:
      # Mount source code
      - ./kura-backend/src:/app/src
      - ./kura-backend/package.json:/app/package.json
      - ./kura-backend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@db:5432/myapp
    depends_on:
      - database
    networks:
      - kura-network-dev

  database:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    container_name: kura-db-dev
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kura-db
    volumes:
      - kura-db-dev:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - kura-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d kura-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512M
    cpus: 1.0

volumes:
  kura-db-dev:
    driver: local

networks:
  kura-network-dev:
    driver: bridge
