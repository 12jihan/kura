name: kura-ai-dev

# Running Services
services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./kura-frontend
      dockerfile: Dockerfile.dev
    networks:
      - kura-network-dev
    env_file:
      - ./kura-backend/.env
    volumes:
      - ./kura-frontend/src:/app/src
      - ./kura-frontend/angular.json:/app/angular.json
      - ./kura-frontend/tsconfig.json:/app/tsconfig.json
      - ./kura-frontend/tsconfig.app.json:/app/tsconfig.app.json
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Required for file watching in Docker
      - WATCHPACK_POLLING=true # Alternative polling option
      - NG_CLI_ANALYTICS=false
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./kura-backend
      dockerfile: Dockerfile.dev
    volumes:
      # Mount source code
      - ./kura-backend/src:/app/src
      - ./kura-backend/package.json:/app/package.json
      - ./kura-backend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    env_file:
      - ./kura-backend/.env
    environment:
      - NODE_ENV=development
      - PG_HOST=database
      - PG_PORT=5432
      - PG_USER=admin
      - PG_PASS=password
      - PG_NAME=kura-db
      - DATABASE_URL=postgresql://admin:password@database:5432/kura-db
    depends_on:
      database:
        condition: service_healthy
    networks:
      - kura-network-dev
    ports:
      - "3000:3000"

  ai-serive:
    build:
      context: ./kura-ai-service
    container_name: kura-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./kura-ai-service:/app # For hot-reloading.
    env_file:
      - ./kura-ai-service/
    networks:
      - kura-network-dev
    depends_on: [backend]

  database:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    container_name: kura-db-dev
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kura-db
    volumes:
      - kura-db-dev:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - kura-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d kura-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512M
    cpus: 1.0

  loki-init:
    image: alpine:latest
    container_name: loki-init
    user: root # <-- this runs as root strictly to fix permissions
    command: chown -R 10001:10001 /tmp/loki
    volumes:
      - loki-data:/tmp/loki
    networks:
      - kura-network-dev

  loki:
    container_name: loki
    image: grafana/loki:latest
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - kura-network-dev
    depends_on:
      loki-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    container_name: promtail
    image: grafana/promtail:latest
    ports:
      - "9080:9080"
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log/
    command: -config.file=/etc/promtail/config.yaml
    restart: unless-stopped
    networks:
      - kura-network-dev

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=password
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - kura-network-dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - kura-network-dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

